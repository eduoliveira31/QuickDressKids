<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalogo" text="Voltar"></ion-back-button>
    </ion-buttons>
    
    <ion-title>{{ produto?.nome || 'Detalhes' }}</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="toggleCoracao()" *ngIf="produto">
        <ion-icon slot="icon-only" [name]="isFavorito ? 'heart' : 'heart-outline'" [color]="isFavorito ? 'danger' : 'medium'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="produto">
    <img [src]="produto.imagem" [alt]="produto.nome" 
         style="width: 100%; border-radius: 12px; object-fit: cover; max-height: 400px;" 
         onerror="this.src='https://ionicframework.com/docs/img/demos/card-media.png'" />

    <h1 class="ion-margin-top">{{ produto.nome }}</h1>
    <ion-text color="medium">
      <p>{{ produto.categoria | titlecase }}</p>
    </ion-text>

    <ion-text color="primary">
      <h1 style="font-weight: bold; font-size: 2rem;">{{ produto.preco | currency:'EUR' }}</h1>
    </ion-text>

    <p *ngIf="produto.descricao" class="ion-margin-top" style="line-height: 1.6;">
      {{ produto.descricao }}
    </p>

    <ion-button expand="block" size="large" class="ion-margin-top" color="dark">
      <ion-icon name="cart" slot="start"></ion-icon>
      Adicionar ao Carrinho
    </ion-button>
  </div>

  <div *ngIf="!produto" class="ion-text-center ion-padding ion-margin-top">
    <ion-spinner name="crescent"></ion-spinner>
    <p>A carregar produto...</p>
  </div>
</ion-content>
