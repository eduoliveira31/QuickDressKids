<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>O Meu Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="light">
  
  <!-- Cabeçalho do Perfil -->
  <div class="ion-text-center ion-margin-top">
    <ion-avatar style="width: 120px; height: 120px; margin: 0 auto; border: 4px solid white; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
      <img [src]="utilizador.foto" alt="Foto de perfil" />
    </ion-avatar>
    
    <h2 class="ion-margin-top" style="font-weight: bold; color: #333;">{{ utilizador.nome }}</h2>
    <p style="color: gray; margin-top: -5px;">{{ utilizador.email }}</p>
    
    <ion-button fill="outline" shape="round" size="small" class="ion-margin-top" (click)="abrirOpcao('Editar Perfil')">
      <ion-icon name="create-outline" slot="start"></ion-icon>
      Editar Perfil
    </ion-button>
  </div>

  <!-- Menu de Opções -->
  <ion-list class="ion-margin-top" inset="true">
    
    <ion-item button detail="true" (click)="abrirOpcao('Reservas Ativas')">
      <ion-icon name="ticket-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Reservas Ativas</ion-label>
    </ion-item>
    
    <ion-item button detail="true" (click)="abrirOpcao('Lojas Favoritas')">
      <ion-icon name="location-outline" slot="start" color="tertiary"></ion-icon>
      <ion-label>Lojas Favoritas</ion-label>
    </ion-item>

    <ion-item button detail="true" (click)="abrirOpcao('Notificações')">
      <ion-icon name="notifications-outline" slot="start" color="warning"></ion-icon>
      <ion-label>Notificações</ion-label>
    </ion-item>

    <ion-item button detail="true" lines="none" (click)="abrirOpcao('Definições de Conta')">
      <ion-icon name="settings-outline" slot="start" color="medium"></ion-icon>
      <ion-label>Definições de Conta</ion-label>
    </ion-item>
  </ion-list>

  <!-- Área de Ajuda -->
  <ion-list class="ion-margin-top" inset="true">
    <ion-item button detail="true" lines="none" (click)="abrirOpcao('Centro de Ajuda')">
      <ion-icon name="help-circle-outline" slot="start" color="success"></ion-icon>
      <ion-label>Centro de Ajuda</ion-label>
    </ion-item>
  </ion-list>

  <!-- Botão Terminar Sessão -->
  <ion-button expand="block" color="danger" fill="clear" class="ion-margin-top" style="margin-bottom: 30px;" (click)="terminarSessao()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    Terminar Sessão
  </ion-button>

</ion-content>
