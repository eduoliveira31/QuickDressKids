<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Catálogo QuickDressKids</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Catálogo</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-segment value="todos" (ionChange)="filtrarCategoria($event)" class="ion-margin-bottom">
    <ion-segment-button value="todos">
      <ion-label>Todos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="bebe">
      <ion-label>Bebé</ion-label>
    </ion-segment-button>
    <ion-segment-button value="menina">
      <ion-label>Menina</ion-label>
    </ion-segment-button>
    <ion-segment-button value="menino">
      <ion-label>Menino</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" *ngFor="let produto of produtosFiltrados">
        <ion-card class="produto-card">
          <img [src]="produto.imagem" [alt]="produto.nome" class="produto-imagem" 
               onerror="this.src='https://ionicframework.com/docs/img/demos/card-media.png'" />
          
          <ion-card-header>
            <ion-card-subtitle>{{ produto.categoria | titlecase }}</ion-card-subtitle>
            <ion-card-title class="ion-text-wrap">{{ produto.nome }}</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <div class="preco-container">
              <ion-text color="primary">
                <h2><strong>{{ produto.preco | currency:'EUR' }}</strong></h2>
              </ion-text>
            </div>
            <ion-button expand="block" fill="outline" size="small" class="ion-margin-top" 
                        [routerLink]="['/produto-detalhe', produto.id]">
              <ion-icon name="eye-outline" slot="start"></ion-icon>
              Ver Detalhes
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div *ngIf="produtosFiltrados.length === 0" class="ion-text-center ion-padding ion-margin-top">
    <ion-icon name="shirt-outline" style="font-size: 3rem; color: #ccc;"></ion-icon>
    <p style="color: #666;">Não encontrámos produtos nesta categoria.</p>
  </div>

</ion-content>
